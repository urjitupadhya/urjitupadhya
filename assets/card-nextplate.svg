  <text x="28" y="234" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="12"><tspan fill="#C9A96E">STACK  </tspan><tspan fill="#A3A3A3">Next.js &#183; Node.js &#183; MongoDB &#183; GenAI</tspan></text>
