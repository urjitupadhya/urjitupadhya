<svg xmlns="http://www.w3.org/2000/svg" width="580" height="250" viewBox="0 0 580 250" role="img" aria-label="NextPlate: AI-powered food redistribution platform connecting restaurants, NGOs and volunteers. Next.js, Node.js, MongoDB, Generative AI. 1st place and $1,000 at Dreamware Hackathon.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080808"/><stop offset="1" stop-color="#151515"/></linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="579" height="249" rx="14" fill="url(#bg)" stroke="#2A2A2A"/>
  <rect x="28" y="0.5" width="90" height="1.5" fill="#C9A96E"/>
  <rect x="28" y="24" width="296" height="26" rx="13" fill="#C9A96E" fill-opacity=".1" stroke="#C9A96E" stroke-opacity=".5"/>
  <text x="44" y="41" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="11" letter-spacing="1.5" fill="#E8D3A2">1ST PLACE &#183; $1,000 &#183; DREAMWARE</text>
