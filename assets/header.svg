<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Urjit Upadhyay, Software Developer. Backend, full-stack, AI/ML and Web3. India, UAE and Canada.">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="#0A0A0A"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="2" fill="#C9A96E"/>

  <!-- floating particles (flat, subtle) -->
  <g fill="#C9A96E">
    <circle cx="110" cy="300" r="2"><animate attributeName="cy" values="320;30" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.5;0" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="300" r="2"><animate attributeName="cy" values="320;30" dur="14s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.4;0" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="300" r="2"><animate attributeName="cy" values="320;30" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.5;0" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="300" r="2"><animate attributeName="cy" values="320;30" dur="15s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.4;0" dur="15s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="300" r="2"><animate attributeName="cy" values="320;30" dur="13s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.5;0" dur="13s" repeatCount="indefinite"/></circle>
  </g>

  <!-- name -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 -14;0 0" dur="1s" fill="freeze"/>
    <text x="600" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="74" font-weight="700" letter-spacing="3" fill="#F5F5F5">URJIT UPADHYAY</text>
    <rect x="570" y="138" width="60" height="3" rx="1.5" fill="#C9A96E"/>
  </g>

  <!-- rotating subtitles -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#BDBDBD" text-anchor="middle">
    <text x="600" y="185" opacity="0">Software Developer @ GoStride Ventures
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.02;0.23;0.25;1" values="0;1;1;0;0"/>
    </text>
    <text x="600" y="185" opacity="0">7x Hackathon Winner  |  1st Place: Slop Scan and Dreamware
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;0.27;0.48;0.5;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="600" y="185" opacity="0">Building ERP, AI/ML, Flutter and Web3 products
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.5;0.52;0.73;0.75;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="600" y="185" opacity="0">Shipping code for teams in India, UAE and Canada
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.75;0.77;0.98;1" values="0;0;1;1;0"/>
    </text>
  </g>

  <!-- chips (flat outlines) -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#E5E5E5">
    <rect x="300" y="212" width="190" height="34" rx="17" fill="none" stroke="#4A4A4A"/>
    <text x="395" y="234">FastAPI  &#183;  React</text>
    <rect x="505" y="212" width="190" height="34" rx="17" fill="none" stroke="#4A4A4A"/>
    <text x="600" y="234">AI / ML  &#183;  GenAI</text>
    <rect x="710" y="212" width="190" height="34" rx="17" fill="none" stroke="#4A4A4A"/>
    <text x="805" y="234">Flutter  &#183;  Web3</text>
    <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.6s" fill="freeze"/>
  </g>

  <!-- waves: flat tonal fills, no gradients -->
  <path fill="#141414" stroke="#C9A96E" stroke-opacity=".45" stroke-width="1">
    <animate attributeName="d" dur="8s" repeatCount="indefinite" values="M0,276 C200,248 400,304 600,276 C800,248 1000,304 1200,276 L1200,340 L0,340 Z;M0,276 C200,304 400,248 600,276 C800,304 1000,248 1200,276 L1200,340 L0,340 Z;M0,276 C200,248 400,304 600,276 C800,248 1000,304 1200,276 L1200,340 L0,340 Z"/>
  </path>
  <path fill="#101010">
    <animate attributeName="d" dur="10s" repeatCount="indefinite" values="M0,296 C150,268 450,322 600,296 C750,268 1050,322 1200,296 L1200,340 L0,340 Z;M0,296 C150,322 450,268 600,296 C750,322 1050,268 1200,296 L1200,340 L0,340 Z;M0,296 C150,268 450,322 600,296 C750,268 1050,322 1200,296 L1200,340 L0,340 Z"/>
  </path>
  <path fill="#0C0C0C">
    <animate attributeName="d" dur="12s" repeatCount="indefinite" values="M0,314 C250,294 350,332 600,314 C850,294 950,332 1200,314 L1200,340 L0,340 Z;M0,314 C250,332 350,294 600,314 C850,332 950,294 1200,314 L1200,340 L0,340 Z;M0,314 C250,294 350,332 600,314 C850,294 950,332 1200,314 L1200,340 L0,340 Z"/>
  </path>
</svg>
