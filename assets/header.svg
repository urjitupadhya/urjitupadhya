<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Urjit Upadhyay, Software Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#0B1B2B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#00D4FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f2a37" stroke-width="1"/>
    </pattern>
    <path id="flow" d="M640 230 C695 230 695 110 750 110 C805 110 805 230 860 230 C915 230 915 110 970 110 C1025 110 1025 230 1080 230"/>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', monospace; }
    .dash { stroke-dasharray: 8 10; animation: move 1.6s linear infinite; }
    @keyframes move { to { stroke-dashoffset: -36; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .25; transform: scale(1); } 50% { opacity: .6; transform: scale(1.35); } }
    @media (prefers-reduced-motion: reduce) { .dash, .pulse { animation: none; } }
  </style>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)" opacity="0.55"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <!-- Name and role -->
  <text x="60" y="124" class="sans" font-size="64" font-weight="700" fill="#F0F6FC" letter-spacing="-1">Urjit Upadhyay</text>
  <text x="60" y="170" class="sans" font-size="26" font-weight="500" fill="#00D4FF">Software Developer at GoStride Ventures</text>
  <text x="60" y="208" class="sans" font-size="17" fill="#9AA7B4">Backend-heavy, AI-powered, cross-platform products</text>
  <text x="60" y="232" class="sans" font-size="17" fill="#9AA7B4">shipped for teams in India, UAE and Canada.</text>

  <!-- Proof strip -->
  <line x1="60" y1="270" x2="850" y2="270" stroke="#243140" stroke-width="1"/>
  <circle cx="68" cy="302" r="4" fill="#00D4FF"/>
  <text x="80" y="307" class="sans" font-size="14" fill="#C9D1D9">7x hackathon winner</text>
  <circle cx="255" cy="302" r="4" fill="#00D4FF"/>
  <text x="267" y="307" class="sans" font-size="14" fill="#C9D1D9">F1 0.943 on 188 real PRs</text>
  <circle cx="480" cy="302" r="4" fill="#00D4FF"/>
  <text x="492" y="307" class="sans" font-size="14" fill="#C9D1D9">72 hours, idea to demo</text>
  <circle cx="685" cy="302" r="4" fill="#C9A96E"/>
  <text x="697" y="307" class="sans" font-size="14" fill="#E8D3A2">Agentic AI builder</text>

  <!-- Stack pipeline: five nodes with even spacing -->
  <use href="#flow" fill="none" stroke="#1d2b3a" stroke-width="3"/>
  <use href="#flow" fill="none" stroke="url(#trace)" stroke-width="3" stroke-linecap="round" class="dash"/>

  <g>
    <circle cx="640" cy="230" r="16" fill="#00D4FF" class="pulse"/>
    <circle cx="640" cy="230" r="8" fill="#0D1117" stroke="#00D4FF" stroke-width="3"/>
    <text x="640" y="268" text-anchor="middle" class="mono" font-size="15" fill="#E6EDF3">FastAPI</text>

    <circle cx="750" cy="110" r="16" fill="#00D4FF" class="pulse" style="animation-delay:.5s"/>
    <circle cx="750" cy="110" r="8" fill="#0D1117" stroke="#38bdf8" stroke-width="3"/>
    <text x="750" y="84" text-anchor="middle" class="mono" font-size="15" fill="#E6EDF3">React</text>

    <circle cx="860" cy="230" r="16" fill="#8b5cf6" class="pulse" style="animation-delay:1s"/>
    <circle cx="860" cy="230" r="8" fill="#0D1117" stroke="#a78bfa" stroke-width="3"/>
    <text x="860" y="268" text-anchor="middle" class="mono" font-size="15" fill="#E6EDF3">Flutter</text>

    <circle cx="970" cy="110" r="16" fill="#8b5cf6" class="pulse" style="animation-delay:1.5s"/>
    <circle cx="970" cy="110" r="8" fill="#0D1117" stroke="#a78bfa" stroke-width="3"/>
    <text x="970" y="84" text-anchor="middle" class="mono" font-size="15" fill="#E6EDF3">Solidity</text>

    <circle cx="1080" cy="230" r="18" fill="#C9A96E" class="pulse" style="animation-delay:2s"/>
    <circle cx="1080" cy="230" r="9" fill="#0D1117" stroke="#C9A96E" stroke-width="3"/>
    <text x="1080" y="268" text-anchor="middle" class="mono" font-size="15" fill="#E8D3A2">Agentic AI</text>
  </g>

  <!-- Signal travelling along the path -->
  <circle r="5" fill="#FFFFFF">
    <animateMotion dur="5s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion>
  </circle>
</svg>
