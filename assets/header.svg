<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Urjit Upadhyay. Building enterprise software, backend services and applied AI. Software Developer at GoStride Ventures, Dubai (remote). Based in Aligarh, India.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080808"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A96E"/>
      <stop offset="1" stop-color="#E8D3A2"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="1" fill="#C9A96E" fill-opacity=".35"/>

  <!-- left: eyebrow, headline, sub -->
  <text x="48" y="70" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13" letter-spacing="2.2" fill="#C9A96E">URJIT UPADHYAY  //  @URJITUPADHYA</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-weight="600" font-size="42" fill="#F5F5F5" letter-spacing="-0.5">
    <text x="48" y="130">Building enterprise software,</text>
    <text x="48" y="180">backend services and applied AI.</text>
  </g>

  <text x="48" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#A3A3A3">Software Developer at GoStride Ventures, Dubai (remote)</text>
  <rect x="48" y="250" width="40" height="3" rx="1.5" fill="url(#gold)"/>

  <!-- right: profile card -->
  <rect x="730" y="40" width="422" height="240" rx="14" fill="#0E0E0E" stroke="#2A2A2A"/>
  <text x="756" y="74" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="11" letter-spacing="2" fill="#737373">PROFILE</text>
  <line x1="756" y1="88" x2="1126" y2="88" stroke="#242424"/>

  <g font-family="Consolas, Menlo, 'Courier New', monospace" font-size="11" letter-spacing="1.5" fill="#737373">
    <text x="756" y="120">ROLE</text>
    <text x="756" y="152">COMPANY</text>
    <text x="756" y="184">BASE</text>
    <text x="756" y="216">STACK</text>
    <text x="756" y="248">WINS</text>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#EDEDED">
    <text x="850" y="120">Software Developer</text>
    <text x="850" y="152">GoStride Ventures</text>
    <text x="850" y="184">Aligarh, India</text>
    <text x="850" y="216">FastAPI &#183; React &#183; Docker</text>
    <text x="850" y="248">7 hackathons</text>
  </g>
  <circle cx="1126" cy="116" r="4" fill="#C9A96E"/>
</svg>
