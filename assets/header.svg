<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Urjit Upadhyay, Software Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="0.5" stop-color="#101436"/>
      <stop offset="1" stop-color="#1a0f3a"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="0.5" stop-color="#8b5cf6">
        <animate attributeName="offset" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#ff6bd6"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ff6bd6" stop-opacity=".30"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity=".25"/>
      <stop offset="1" stop-color="#00d4ff" stop-opacity=".25"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>

  <!-- drifting colour orbs -->
  <circle cx="200" cy="90" r="120" fill="#00d4ff" opacity=".25" filter="url(#blur)">
    <animate attributeName="cx" values="200;420;200" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="120" r="140" fill="#8b5cf6" opacity=".30" filter="url(#blur)">
    <animate attributeName="cx" values="1000;780;1000" dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- floating particles -->
  <g fill="#ffffff">
    <circle cx="90"  cy="300" r="2.5"><animate attributeName="cy" values="320;20" dur="9s"  repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="9s"  repeatCount="indefinite"/></circle>
    <circle cx="210" cy="300" r="2"  ><animate attributeName="cy" values="320;20" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="300" r="3"  ><animate attributeName="cy" values="320;20" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="300" r="2"  ><animate attributeName="cy" values="320;20" dur="14s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;0" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="300" r="2.5"><animate attributeName="cy" values="320;20" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="300" r="2"  ><animate attributeName="cy" values="320;20" dur="13s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="13s" repeatCount="indefinite"/></circle>
    <circle cx="910" cy="300" r="3"  ><animate attributeName="cy" values="320;20" dur="8s"  repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="8s"  repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="300" r="2" ><animate attributeName="cy" values="320;20" dur="15s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;0" dur="15s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="300" r="2.5"><animate attributeName="cy" values="320;20" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="10s" repeatCount="indefinite"/></circle>
  </g>

  <!-- name -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 -20;0 0" dur="1.2s" fill="freeze"/>
    <text x="600" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="2" fill="url(#name)" filter="url(#glow)">URJIT UPADHYAY</text>
  </g>

  <!-- rotating subtitles -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#cbd5e1" text-anchor="middle">
    <text x="600" y="172" opacity="0">Software Developer @ GoStride Ventures
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.02;0.23;0.25;1" values="0;1;1;0;0"/>
    </text>
    <text x="600" y="172" opacity="0">7x Hackathon Winner  |  1st Place: Slop Scan and Dreamware
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.25;0.27;0.48;0.5;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="600" y="172" opacity="0">Building ERP, AI/ML, Flutter and Web3 products
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.5;0.52;0.73;0.75;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="600" y="172" opacity="0">Shipping code for teams in India, UAE and Canada
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.75;0.77;0.98;1" values="0;0;1;1;0"/>
    </text>
  </g>

  <!-- chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#e2e8f0">
    <rect x="300" y="202" width="190" height="34" rx="17" fill="#00d4ff" fill-opacity=".12" stroke="#00d4ff" stroke-opacity=".6"/>
    <text x="395" y="224">FastAPI  .  React</text>
    <rect x="505" y="202" width="190" height="34" rx="17" fill="#8b5cf6" fill-opacity=".14" stroke="#8b5cf6" stroke-opacity=".7"/>
    <text x="600" y="224">AI / ML  .  GenAI</text>
    <rect x="710" y="202" width="190" height="34" rx="17" fill="#ff6bd6" fill-opacity=".12" stroke="#ff6bd6" stroke-opacity=".6"/>
    <text x="805" y="224">Flutter  .  Web3</text>
    <animate attributeName="opacity" values="0;1" dur="1.5s" begin="0.8s" fill="freeze"/>
  </g>

  <!-- waves -->
  <path fill="url(#w1)">
    <animate attributeName="d" dur="7s" repeatCount="indefinite" values="M0,270 C200,240 400,300 600,270 C800,240 1000,300 1200,270 L1200,340 L0,340 Z;M0,270 C200,300 400,240 600,270 C800,300 1000,240 1200,270 L1200,340 L0,340 Z;M0,270 C200,240 400,300 600,270 C800,240 1000,300 1200,270 L1200,340 L0,340 Z"/>
  </path>
  <path fill="url(#w2)">
    <animate attributeName="d" dur="9s" repeatCount="indefinite" values="M0,290 C150,260 450,320 600,290 C750,260 1050,320 1200,290 L1200,340 L0,340 Z;M0,290 C150,320 450,260 600,290 C750,320 1050,260 1200,290 L1200,340 L0,340 Z;M0,290 C150,260 450,320 600,290 C750,260 1050,320 1200,290 L1200,340 L0,340 Z"/>
  </path>
  <path fill="url(#w3)">
    <animate attributeName="d" dur="11s" repeatCount="indefinite" values="M0,308 C250,285 350,330 600,308 C850,285 950,330 1200,308 L1200,340 L0,340 Z;M0,308 C250,330 350,285 600,308 C850,330 950,285 1200,308 L1200,340 L0,340 Z;M0,308 C250,285 350,330 600,308 C850,285 950,330 1200,308 L1200,340 L0,340 Z"/>
  </path>
</svg>
