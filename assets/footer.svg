<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Footer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b1a" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0f3a"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="0.5" stop-color="#8b5cf6">
        <animate attributeName="offset" values="0.2;0.8;0.2" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#ff6bd6"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".30"/>
      <stop offset="1" stop-color="#ff6bd6" stop-opacity=".30"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="200" fill="url(#bg)"/>
  <path fill="url(#w1)">
    <animate attributeName="d" dur="8s" repeatCount="indefinite" values="M0,120 C200,90 400,150 600,120 C800,90 1000,150 1200,120 L1200,200 L0,200 Z;M0,120 C200,150 400,90 600,120 C800,150 1000,90 1200,120 L1200,200 L0,200 Z;M0,120 C200,90 400,150 600,120 C800,90 1000,150 1200,120 L1200,200 L0,200 Z"/>
  </path>
  <path fill="url(#w2)">
    <animate attributeName="d" dur="10s" repeatCount="indefinite" values="M0,145 C150,120 450,170 600,145 C750,120 1050,170 1200,145 L1200,200 L0,200 Z;M0,145 C150,170 450,120 600,145 C750,170 1050,120 1200,145 L1200,200 L0,200 Z;M0,145 C150,120 450,170 600,145 C750,120 1050,170 1200,145 L1200,200 L0,200 Z"/>
  </path>
  <text x="600" y="92" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="url(#t)">Let's build something great together.</text>
  <text x="600" y="124" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#cbd5e1">urjitupadhyayuu@gmail.com</text>
</svg>
