<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Seven hackathon wins. SlopGuard: F1 0.943, 71 passing tests, built in 72 hours. Diploma CGPA 9.97, University Rank 2.">
  <defs>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9A96E"/>
      <stop offset="1" stop-color="#3A3A3A"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#151515"/>
    </linearGradient>
  </defs>
  <style>
    .num{font:800 42px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#E8D3A2}
    .lbl{font:600 15px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#F5F5F5}
    .sub{font:400 12px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#8A8A8A}
  </style>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".6s" begin="0s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 20;0 0" dur=".6s" begin="0s" fill="freeze"/>
    <rect x="0.5" y="10" width="219" height="125" rx="14" fill="url(#card)" stroke="url(#bd)" stroke-opacity=".7"/>
    <text x="110" y="62" text-anchor="middle" class="num">7x</text>
    <text x="110" y="92" text-anchor="middle" class="lbl">Hackathon wins</text>
    <text x="110" y="114" text-anchor="middle" class="sub">including two 1st places</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".6s" begin=".12s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 20;0 0" dur=".6s" begin=".12s" fill="freeze"/>
    <rect x="245.5" y="10" width="219" height="125" rx="14" fill="url(#card)" stroke="url(#bd)" stroke-opacity=".7"/>
    <text x="355" y="62" text-anchor="middle" class="num">0.943</text>
    <text x="355" y="92" text-anchor="middle" class="lbl">F1 score</text>
    <text x="355" y="114" text-anchor="middle" class="sub">SlopGuard, 188 real PRs</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".6s" begin=".24s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 20;0 0" dur=".6s" begin=".24s" fill="freeze"/>
    <rect x="490.5" y="10" width="219" height="125" rx="14" fill="url(#card)" stroke="url(#bd)" stroke-opacity=".7"/>
    <text x="600" y="62" text-anchor="middle" class="num">71</text>
    <text x="600" y="92" text-anchor="middle" class="lbl">Passing tests</text>
    <text x="600" y="114" text-anchor="middle" class="sub">SlopGuard</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".6s" begin=".36s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 20;0 0" dur=".6s" begin=".36s" fill="freeze"/>
    <rect x="735.5" y="10" width="219" height="125" rx="14" fill="url(#card)" stroke="url(#bd)" stroke-opacity=".7"/>
    <text x="845" y="62" text-anchor="middle" class="num">72h</text>
    <text x="845" y="92" text-anchor="middle" class="lbl">Build time</text>
    <text x="845" y="114" text-anchor="middle" class="sub">SlopGuard, hackathon</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".6s" begin=".48s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 20;0 0" dur=".6s" begin=".48s" fill="freeze"/>
    <rect x="980.5" y="10" width="219" height="125" rx="14" fill="url(#card)" stroke="url(#bd)" stroke-opacity=".7"/>
    <text x="1090" y="62" text-anchor="middle" class="num">9.97</text>
    <text x="1090" y="92" text-anchor="middle" class="lbl">Diploma CGPA</text>
    <text x="1090" y="114" text-anchor="middle" class="sub">University Rank 2</text>
  </g>
</svg>
