<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Key numbers">
  <defs>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <style>
    .num{font:800 42px 'Segoe UI',Helvetica,Arial,sans-serif}
    .lbl{font:600 15px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#e2e8f0}
    .sub{font:400 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#94a3b8}
  </style>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".6s" begin="0s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 24;0 0" dur=".6s" begin="0s" fill="freeze"/>
    <rect x="0" y="10" width="220" height="125" rx="16" fill="#0d1326" stroke="url(#bd)" stroke-width="1.5"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="3s" repeatCount="indefinite"/></rect>
    <text x="110" y="62" text-anchor="middle" class="num" fill="#fbbf24">7x</text>
    <text x="110" y="92" text-anchor="middle" class="lbl">Hackathon Wins</text>
    <text x="110" y="114" text-anchor="middle" class="sub">2x 1st Place</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".6s" begin=".15s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 24;0 0" dur=".6s" begin=".15s" fill="freeze"/>
    <rect x="245" y="10" width="220" height="125" rx="16" fill="#0d1326" stroke="url(#bd)" stroke-width="1.5"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="3s" begin=".5s" repeatCount="indefinite"/></rect>
    <text x="355" y="62" text-anchor="middle" class="num" fill="#00d4ff">4</text>
    <text x="355" y="92" text-anchor="middle" class="lbl">Teams Shipped For</text>
    <text x="355" y="114" text-anchor="middle" class="sub">India . UAE . Canada</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".6s" begin=".3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 24;0 0" dur=".6s" begin=".3s" fill="freeze"/>
    <rect x="490" y="10" width="220" height="125" rx="16" fill="#0d1326" stroke="url(#bd)" stroke-width="1.5"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="3s" begin="1s" repeatCount="indefinite"/></rect>
    <text x="600" y="62" text-anchor="middle" class="num" fill="#8b5cf6">0.943</text>
    <text x="600" y="92" text-anchor="middle" class="lbl">F1 Score</text>
    <text x="600" y="114" text-anchor="middle" class="sub">188 real GitHub PRs</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".6s" begin=".45s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 24;0 0" dur=".6s" begin=".45s" fill="freeze"/>
    <rect x="735" y="10" width="220" height="125" rx="16" fill="#0d1326" stroke="url(#bd)" stroke-width="1.5"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="3s" begin="1.5s" repeatCount="indefinite"/></rect>
    <text x="845" y="62" text-anchor="middle" class="num" fill="#ff6bd6">72h</text>
    <text x="845" y="92" text-anchor="middle" class="lbl">Idea to Shipped</text>
    <text x="845" y="114" text-anchor="middle" class="sub">71 passing tests</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".6s" begin=".6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="0 24;0 0" dur=".6s" begin=".6s" fill="freeze"/>
    <rect x="980" y="10" width="220" height="125" rx="16" fill="#0d1326" stroke="url(#bd)" stroke-width="1.5"><animate attributeName="stroke-opacity" values=".35;1;.35" dur="3s" begin="2s" repeatCount="indefinite"/></rect>
    <text x="1090" y="62" text-anchor="middle" class="num" fill="#10b981">9.97</text>
    <text x="1090" y="92" text-anchor="middle" class="lbl">Diploma CGPA</text>
    <text x="1090" y="114" text-anchor="middle" class="sub">University Rank 2</text>
  </g>
</svg>
