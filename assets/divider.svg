<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="14" viewBox="0 0 1200 14" role="img" aria-label="divider">
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff6bd6" stop-opacity="0"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect x="0" y="6" width="1200" height="2" fill="url(#l)"/>
  <circle cx="0" cy="7" r="5" fill="#00d4ff" filter="url(#g)">
    <animate attributeName="cx" values="0;1200;0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="7" r="2" fill="#ffffff">
    <animate attributeName="cx" values="0;1200;0" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
