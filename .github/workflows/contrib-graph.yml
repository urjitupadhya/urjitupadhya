import json
import os
import urllib.request

USER = os.environ.get("GH_USER", "urjitupadhya")
TOKEN = os.environ.get("GH_TOKEN", "")
OUT = os.environ.get("OUT", "assets/contrib.svg")

QUERY = """
query($login: String!) {
  user(login: $login) {
    contributionsCollection {
      contributionCalendar {
        totalContributions
        weeks { contributionDays { date contributionCount } }
      }
    }
  }
}
"""


def fetch():
    if os.environ.get("MOCK"):
        import random
        random.seed(3)
        weeks = [{"contributionDays": [
            {"date": f"2026-01-{(w % 28) + 1:02d}", "contributionCount": random.choice([0, 0, 1, 3, 6, 10])}
            for _ in range(7)]} for w in range(53)]
        return {"totalContributions": sum(d["contributionCount"] for w in weeks for d in w["contributionDays"]),
                "weeks": weeks}
    req = urllib.request.Request(
        "https://api.github.com/graphql",
        data=json.dumps({"query": QUERY, "variables": {"login": USER}}).encode(),
        headers={"Authorization": f"bearer {TOKEN}", "Content-Type": "application/json"},
    )
    with urllib.request.urlopen(req, timeout=30) as r:
        data = json.load(r)
    return data["data"]["user"]["contributionsCollection"]["contributionCalendar"]


def level(n, peak):
    if n == 0:
        return 0
    q = n / peak
    return 1 if q <= 0.25 else 2 if q <= 0.5 else 3 if q <= 0.75 else 4


def build(cal):
    colors = ["#161b22", "#0c4a5e", "#0e7c99", "#00a8cc", "#00D4FF"]
    cell, gap, left, top = 13, 4, 20, 56
    weeks = cal["weeks"]
    peak = max((d["contributionCount"] for w in weeks for d in w["contributionDays"]), default=1) or 1
    width = left + len(weeks) * (cell + gap) + 20
    height = top + 7 * (cell + gap) + 40

    rects = []
    for x, w in enumerate(weeks):
        for y, d in enumerate(w["contributionDays"]):
            n = d["contributionCount"]
            rects.append(
                f'<rect x="{left + x * (cell + gap)}" y="{top + y * (cell + gap)}" width="{cell}" height="{cell}" '
                f'rx="3" fill="{colors[level(n, peak)]}"><title>{n} contributions on {d["date"]}</title></rect>'
            )

    legend_x = width - 20 - 5 * (cell + 4) - 70
    legend = "".join(
        f'<rect x="{legend_x + 34 + i * (cell + 4)}" y="{height - 26}" width="{cell}" height="{cell}" rx="3" fill="{c}"/>'
        for i, c in enumerate(colors)
    )
    return f"""<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {width} {height}" width="{width}" height="{height}" role="img" aria-label="Contribution graph">
<rect width="{width}" height="{height}" rx="12" fill="#0D1117"/>
<text x="{left}" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="600" fill="#00D4FF">{cal["totalContributions"]} contributions in the last year</text>
{''.join(rects)}
<text x="{legend_x}" y="{height - 15}" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8B949E">Less</text>
{legend}
<text x="{legend_x + 40 + 5 * (cell + 4)}" y="{height - 15}" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8B949E">More</text>
</svg>
"""


if __name__ == "__main__":
    os.makedirs(os.path.dirname(OUT), exist_ok=True)
    with open(OUT, "w", encoding="utf-8") as f:
        f.write(build(fetch()))
    print("wrote", OUT)
